# pnpm-workspace.yaml — PISAStyle
#
# Repo de paquete UNICO (no monorepo). `packages: []` se declara vacio a
# proposito: sin este campo, pnpm >= 11 aborta con
#   "ERROR packages field missing or empty"
# en `pnpm store path`, que es el primer paso de TODOS los jobs de
# deploy.yml y de ci-template.yml. Medido 2026-10-03: los 20 runs de deploy
# hasta entonces eran 4 failure + 16 cancelled, cero exito, todos muertos aqui.
packages: []
allowBuilds:
  esbuild: true
  workerd: true
  sharp: true
