# Grouped weekly Dependabot configuration (SWAL wave pi-1, S7).
# Grouped pull requests per ecosystem.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Grouped PRs per ecosystem limit.
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      # Minor and patch updates: grouped into a single PR.
      minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      # Security updates keep their own single PR so an
      # advisory patch is never buried in a batch.
      security-dependencies:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Grouped PRs per ecosystem limit.
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      # Minor and patch updates: grouped into a single PR.
      minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      # Security updates keep their own single PR so an
      # advisory patch is never buried in a batch.
      security-dependencies:
        applies-to: security-updates
        patterns:
          - "*"
