name: deploy-template

on:
  push:
    branches: [main, develop]
    paths:
      - "src/**"
      - "public/**"
      - "workers/**"
      - "migrations/**"
      - "astro.config.mjs"
      - "wrangler.toml"
      - "package.json"
      # Sin esto, un fix que solo toque pnpm-workspace.yaml NO dispara el
      # deploy — que es justo lo que paso con el campo `packages`: se corrigio
      # y el workflow nunca llego a ejecutarse, asi que nadie vio que seguia
      # fallando. Los tres ficheros que gobiernan la instalacion en CI.
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - ".github/workflows/**"
  workflow_dispatch:
    inputs:
      target:
        description: "Destination environment for a manual run"
        type: choice
        options: [production, staging]
        default: staging

permissions:
  contents: write
  deployments: write
  id-token: write

# Una clave por rama: sin esto, un push a develop cancelaba en curso el deploy
# de main (y al reves) porque ambas caian en el mismo grupo.
concurrency:
  group: deploy-template-${{ github.ref }}-${{ inputs.target || 'auto' }}
  cancel-in-progress: true

env:
  # main = produccion. develop = staging de pruebas. Cualquier otra rama no
  # entra por `on.push.branches`, asi que esto no necesita un default tercer.
  PRODUCTION_BRANCH: main
  STAGING_BRANCH: develop
  PRODUCTION_WORKER_NAME: pisastyle
  # Nombre deliberadamente explicito: nada de este worker debe confundirse con
  # el de produccion, ni en Cloudflare, ni en un smoke test, ni en un tag.
  STAGING_WORKER_NAME: pisastyle-staging
  PRODUCTION_APP_URL: https://pisa.swal.network
  STAGING_APP_URL: https://pisastyle-staging.iberi22.workers.dev

jobs:
  # Fase 0: resolver el destino de este run. Una sola fuente de verdad para
  # nombre de worker, URL de smoke y si toca taggear version.
  resolve-target:
    name: "🎯 Resolve Target"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      target: ${{ steps.pick.outputs.target }}
      worker_name: ${{ steps.pick.outputs.worker_name }}
      app_url: ${{ steps.pick.outputs.app_url }}
      is_production: ${{ steps.pick.outputs.is_production }}
    steps:
      - id: pick
        env:
          REF: ${{ github.ref_name }}
          REQUESTED: ${{ inputs.target }}
          PRODUCTION_BRANCH: ${{ env.PRODUCTION_BRANCH }}
          STAGING_BRANCH: ${{ env.STAGING_BRANCH }}
          PRODUCTION_WORKER_NAME: ${{ env.PRODUCTION_WORKER_NAME }}
          STAGING_WORKER_NAME: ${{ env.STAGING_WORKER_NAME }}
          PRODUCTION_APP_URL: ${{ env.PRODUCTION_APP_URL }}
          STAGING_APP_URL: ${{ env.STAGING_APP_URL }}
        run: |
          set -euo pipefail
          # `${VAR:-}` en vez de `$VAR`: en un push (no dispatch) `inputs.target`
          # es null y podria llegar sin definir, lo que con `set -u` mataria el job.
          REQUESTED="${REQUESTED:-}"
          if [ "$REQUESTED" = "production" ]; then
            target="production"
          elif [ "$REQUESTED" = "staging" ]; then
            target="staging"
          elif [ "$REF" = "$PRODUCTION_BRANCH" ]; then
            target="production"
          else
            target="staging"
          fi

          if [ "$target" = "production" ]; then
            worker_name="$PRODUCTION_WORKER_NAME"
            app_url="$PRODUCTION_APP_URL"
            is_production="true"
          else
            worker_name="$STAGING_WORKER_NAME"
            app_url="$STAGING_APP_URL"
            is_production="false"
          fi

          echo "target=$target"     >> "$GITHUB_OUTPUT"
          echo "worker_name=$worker_name" >> "$GITHUB_OUTPUT"
          echo "app_url=$app_url"   >> "$GITHUB_OUTPUT"
          echo "is_production=$is_production" >> "$GITHUB_OUTPUT"
          echo "Deploy target: $target ($worker_name) -> $app_url"

  # Fase 1: Preflight
  audit-and-verify:
    name: "🛡️ Preflight Audit"
    needs: resolve-target
    runs-on: ubuntu-latest
    # 15 min: ademas de check + tests + E2E, ahora el propio preflight construye
    # (el `webServer` de Playwright solo arranca `astro preview`, que necesita
    # `dist/`). Con 10 el job se cancelaba por tiempo en runners cargados.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 9 }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm test
      # `pnpm exec playwright test` a secas NO puede pasar: el `webServer` de
      # playwright.config.ts solo arranca `astro preview`, y sin `dist/` el
      # preview no sirve nada y Playwright mata el job con exit 1. El build va
      # aqui, explicito. No se usa `pnpm run test:e2e` porque ese script envuelve
      # Playwright con el Chromium de NixOS (scripts/with-nix-browser.sh), que no
      # existe en el runner de GitHub; aqui vale el Chromium que instala
      # Playwright unas lineas mas abajo.
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Build for E2E (astro preview sirve este dist)
        run: pnpm run build
      - name: E2E (chromium, desktop + mobile)
        run: pnpm exec playwright test

  # Fase 3: Deploy SSR Worker (Pages vs Workers: SSR >26MB → wrangler deploy, no pages-action)
  deploy-worker:
    name: "🚀 Deploy (${{ needs.resolve-target.outputs.target }})"
    needs: [resolve-target, audit-and-verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ needs.resolve-target.outputs.target }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 9 }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Build SSR
        run: pnpm run build
      - name: Verify deploy config
        # Unica puerta previa a Cloudflare, y la unica que sabe como debe salir
        # este deploy: la app no usa bindings y produccion vive en el custom
        # domain pisa.swal.network. Se comprueba sobre el fichero del repo y
        # sobre el bundle ya construido, y solo se imprime true/false: el repo
        # es publico y aqui no puede salir ni un id.
        run: |
          set -euo pipefail
          node -e '
            const fs = require("node:fs");
            const src = fs.readFileSync("wrangler.toml", "utf8");
            const placeholder = /REPLACE-ME/.test(src);
            const bindings = /^\s*\[\[(d1_databases|r2_buckets|kv_namespaces)\]\]/m.test(src);
            const ok = !placeholder && !bindings;
            console.log(`wrangler.toml sin placeholders ni bindings: ${ok}`);
            if (!ok) {
              console.error("::error::wrangler.toml lleva REPLACE-ME o un bloque d1/r2/kv: esta app no usa bindings, quitalo o justifica el cambio en el PR");
              process.exit(1);
            }
          '
          node -e '
            const fs = require("node:fs");
            const cfg = JSON.parse(fs.readFileSync("dist/server/wrangler.json", "utf8"));
            const route = (cfg.routes ?? []).find((r) => r && r.pattern === "pisa.swal.network" && r.custom_domain === true);
            const ok = Boolean(route);
            console.log(`bundle con custom domain pisa.swal.network: ${ok}`);
            if (!ok) {
              console.error("::error::dist/server/wrangler.json no lleva la ruta pisa.swal.network con custom_domain=true: el worker se desplegaria sin dominio");
              process.exit(1);
            }
          '
      - name: Staging bundle without the production domain
        # Staging reuses the production bundle under another worker name; without this
        # step it would also claim the custom domain pisa.swal.network.
        if: needs.resolve-target.outputs.target == 'staging'
        run: |
          node -e '
            const fs = require("node:fs");
            const p = "dist/server/wrangler.json";
            const cfg = JSON.parse(fs.readFileSync(p, "utf8"));
            delete cfg.routes;
            cfg.workers_dev = true;
            cfg.vars = { ...(cfg.vars ?? {}), ENVIRONMENT: "staging" };
            fs.writeFileSync(p, JSON.stringify(cfg, null, 2));
            console.log("staging bundle: routes removed, workers_dev=true");
          '
      - name: Deploy Worker to Cloudflare
        # wrangler-action tries `pnpm add wrangler` at the workspace root, which pnpm
        # refuses (ERR_PNPM_ADDING_TO_ROOT). Run the pinned wrangler with pnpm dlx.
        # `--name` gives staging its own worker; the step above strips its routes.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          pnpm dlx wrangler@4.127.1 deploy
          --config dist/server/wrangler.json
          --name ${{ needs.resolve-target.outputs.worker_name }}

  # Fase 4+5: Smoke + Version Tag
  smoke-test:
    name: "🩺 Smoke (${{ needs.resolve-target.outputs.target }})"
    needs: [resolve-target, deploy-worker]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Smoke
        if: hashFiles('scripts/deploy-smoke.sh') != ''
        run: bash scripts/deploy-smoke.sh
        env:
          APP_URL: ${{ needs.resolve-target.outputs.app_url }}
          DEPLOY_TARGET: ${{ needs.resolve-target.outputs.target }}
      - name: Verify Worker Reachable
        # Sustituye al script ausente: con el, staging y produccion siguen
        # teniendo un smoke real en vez de un job que pasa en verde sin comprobar
        # nada. `--retry` cubre el cold start del worker recien desplegado.
        run: |
          set -euo pipefail
          APP_URL="$APP_URL" EXPECT_STATUS="${EXPECT_STATUS:-200}" node -e '
            const url = process.env.APP_URL;
            const expected = Number(process.env.EXPECT_STATUS);
            (async () => {
              let last = "";
              for (let i = 1; i <= 5; i++) {
                try {
                  const res = await fetch(url, { redirect: "follow" });
                  const body = await res.text();
                  if (res.status !== expected) throw new Error(`status ${res.status} (want ${expected})`);
                  if (!body.includes("<html")) throw new Error("response is not an HTML document");
                  console.log(`smoke ok on attempt ${i}: ${url} -> ${res.status}`);
                  return;
                } catch (err) {
                  last = String(err && err.message ? err.message : err);
                  console.log(`attempt ${i} failed: ${last}`);
                  await new Promise((r) => setTimeout(r, 5000 * i));
                }
              }
              console.error(`smoke FAILED for ${url}: ${last}`);
              process.exit(1);
            })();
          '
        env:
          APP_URL: ${{ needs.resolve-target.outputs.app_url }}
          DEPLOY_TARGET: ${{ needs.resolve-target.outputs.target }}

  version-tag:
    name: "🏷️ Tag"
    needs: [resolve-target, smoke-test]
    runs-on: ubuntu-latest
    # Solo produccion taguea. Etiquetar cada push a develop ensuciaria el
    # historial de releases con tags que no describen ninguna release.
    if: needs.resolve-target.outputs.is_production == 'true'
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}-deploy-$(date +'%Y%m%d-%H%M%S')-$(echo ${{ github.sha }} | cut -c1-8)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Deploy $TAG" && git push origin "$TAG" && echo "Tag $TAG"